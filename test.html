<script>
const http = require('http');
const path = require('path');
const fs = require('fs');

// Try to get the acompanhar page
const options = {
  hostname: 'localhost',
  port: 3001,
  path: '/acompanhar',
  method: 'GET'
};

const req = http.request(options, res => {
  let data = '';
  res.on('data', chunk => data += chunk);
  res.on('end', () => {
    console.log('Status:', res.statusCode);
    console.log('Body length:', data.length);
    console.log('Body first 1000:', data.substring(0, 1000));
  });
});
req.end();
});
