name: Cardapio SaaS - CI

on:
  push:
    branches: [main, master, feature/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: ESLint (zero erros)
        run: npm run lint

      - name: TypeScript check (strict, sem emitir)
        run: npm run typecheck

  test:
    name: Testes (Jest)
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardapio_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cardapio_saas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # papeis separados, como em producao: o app fica sujeito a RLS
      DATABASE_URL: postgresql://cardapio_app:cardapio_app@localhost:5432/cardapio_saas
      SUPER_ADMIN_DATABASE_URL: postgresql://cardapio_admin:cardapio_admin@localhost:5432/cardapio_saas
      JWT_SECRET: ci-secret-de-teste-nao-usar-em-producao
      TENANT_RESOLVER: auto
      WILDCARD_DOMAIN: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # cria os papeis e concede CREATE no schema public (PG 15+)
      - name: Preparar papeis do banco
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d cardapio_saas -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cardapio_app LOGIN PASSWORD 'cardapio_app' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE cardapio_admin LOGIN PASSWORD 'cardapio_admin' NOSUPERUSER BYPASSRLS CREATEDB;
          GRANT ALL PRIVILEGES ON DATABASE cardapio_saas TO cardapio_app, cardapio_admin;
          GRANT CREATE, USAGE ON SCHEMA public TO cardapio_app, cardapio_admin;
          SQL

      - name: Migrations
        run: npm run migrate

      - name: Jest (unitarias + API + auth)
        run: npm run test:ci

      - name: Suite de isolamento multi-tenant (RLS, quotas, SSE, upload)
        run: npm run test:isolation

      - name: Conferir sintaxe de todos os arquivos
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cardapio-saas:${{ github.sha }}
