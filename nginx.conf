# ============================================================
# nginx — Cardápio Digital SaaS
# - Proxy reverso para o app Node (127.0.0.1:3001)
# - Server_name curinga (wildcard) para os subdomínios das lojas
# - O Host original é preservado: é assim que o app resolve o tenant
# - HTTP > HTTPS e ACME (Let's Encrypt / Cloudflare) na Challenge
#
# Substitua seusaas.com pelo seu domínio e monte o certificado
# curinga antes de subir em produção:
#   certbot certonly --manual --preferred-challenges dns \
#     -d seusaas.com -d "*.seusaas.com"
# ============================================================

# redireciona tudo para HTTPS (menos o challenge do ACME)
server {
    listen 80;
    listen [::]:80;
    server_name seusaas.com *.seusaas.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# painel da plataforma
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seusaas.com;

    ssl_certificate     /etc/letsencrypt/live/seusaas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seusaas.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy.conf; }
}

# lojas (wildcard) — um único server cobre todos os tenants
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.seusaas.com;

    ssl_certificate     /etc/letsencrypt/live/seusaas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seusaas.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # limites: upload de imagem até 6 MB
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy.conf;
    }
}
